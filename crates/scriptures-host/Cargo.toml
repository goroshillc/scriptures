[package]
name = "scriptures-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Scriptures' own static host: serves one built reader directory on loopback, apart from every work system."

# WHY its own crate: the reader shares no process, cookie, session, login, code path or
# data with any other system. This binary serves static files and reads no cookie.

[[bin]]
name = "goroshi-scriptures-host"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "fs"] }
tower = { workspace = true }
tower-http = { version = "=0.6.11", features = ["fs"] }
thiserror = "=2.0.21"

[dev-dependencies]
http-body-util = "=0.1.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
as_conversions = "deny"
indexing_slicing = "deny"
